<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="format-detection" content="telephone=no">
<title>Swiss Bürgerquiz</title>
<link rel="stylesheet" href="fonts.css">
<style>
/* Layout: one narrow column like a tram-stop display; quiz progress drawn as a tram line with stops */
:root{
  --paper:#eef3ef; --card:#ffffff; --ink:#13201a; --muted:#56675d; --rule:#d3ddd6; --sunk:#e3ebe5;
  --tram:#0e7a45; --tram-ink:#ffffff; --gold:#d99a00; --signal:#cf2a1f; --good:#0e7a45;
  --good-bg:#dff2e7; --bad-bg:#fbe3e0;
  --l1:#cf2a1f; --l2:#0e7a45; --l3:#1f5fbf; --l4:#a35a00;
  --f-display:"Bricolage Grotesque", "Arial Rounded MT Bold", system-ui, sans-serif;
  --f-body:"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0d1511; --card:#17221c; --ink:#e6eee8; --muted:#98a89e; --rule:#2a3a31; --sunk:#1f2c25;
  --tram:#38b874; --tram-ink:#06140c; --gold:#f2c040; --signal:#ff6d60; --good:#4cc985;
  --good-bg:#183526; --bad-bg:#3a1c19;
  --l1:#ff6d60; --l2:#4cc985; --l3:#6aa1ff; --l4:#f0a040; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0d1511; --card:#17221c; --ink:#e6eee8; --muted:#98a89e; --rule:#2a3a31; --sunk:#1f2c25;
  --tram:#38b874; --tram-ink:#06140c; --gold:#f2c040; --signal:#ff6d60; --good:#4cc985;
  --good-bg:#183526; --bad-bg:#3a1c19;
  --l1:#ff6d60; --l2:#4cc985; --l3:#6aa1ff; --l4:#f0a040; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
html,body{min-height:100%;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{-webkit-user-select:none;user-select:none;overscroll-behavior-y:none}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-top:calc(20px + env(safe-area-inset-top, 0px));padding-bottom:calc(40px + env(safe-area-inset-bottom, 0px))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.09em;font-weight:600;color:var(--muted)}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:40px;height:40px;border-radius:10px;background:var(--tram);color:var(--tram-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:20px}
.brand h1{font-size:22px;font-weight:800}
.iconbtn{width:40px;height:40px;border-radius:12px;border:2px solid var(--rule);background:var(--card);display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px}

/* level card */
.level{background:var(--card);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;border:2px solid var(--rule)}
.level-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.level-name{font-family:var(--f-display);font-size:24px;font-weight:800}
.bar{height:12px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}

/* lines */
.lines{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.linecard{text-align:left;background:var(--card);border:2px solid var(--rule);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;box-shadow:0 4px 0 var(--rule);transition:transform .08s}
.linecard:active{transform:translateY(3px);box-shadow:0 1px 0 var(--rule)}
.linecard:hover{border-color:var(--lc)}
.lnum{width:36px;height:36px;border-radius:8px;background:var(--lc);color:var(--card);font-family:var(--f-display);font-weight:800;font-size:20px;display:grid;place-items:center}
.linecard h3{font-size:17px}
.linecard small{color:var(--muted);font-size:13px}
.stars{display:flex;gap:2px}
.stars svg{width:16px;height:16px}

.modes{display:flex;flex-direction:column;gap:10px}
.mode{display:flex;align-items:center;gap:14px;text-align:left;background:var(--card);border:2px solid var(--rule);border-radius:16px;padding:14px;box-shadow:0 4px 0 var(--rule)}
.mode:active{transform:translateY(3px);box-shadow:0 1px 0 var(--rule)}
.mode .ic{width:44px;height:44px;flex:none;border-radius:12px;display:grid;place-items:center;background:var(--sunk)}
.mode .ic svg{width:24px;height:24px}
.mode b{display:block;font-size:16px}
.mode span{color:var(--muted);font-size:14px}
.mode[disabled]{opacity:.5;cursor:not-allowed}

.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{background:var(--card);border:2px dashed var(--rule);border-radius:14px;padding:10px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.badge svg{width:40px;height:40px}
.badge b{font-size:13px;line-height:1.2}
.badge small{font-size:11px;color:var(--muted);line-height:1.3}
.badge.on{border-style:solid;border-color:var(--gold)}
.badge:not(.on) svg{opacity:.3}
.note{font-size:13px;color:var(--muted);line-height:1.5}

/* play */
.hud{display:flex;align-items:center;gap:12px;justify-content:space-between}
.hearts{display:flex;gap:4px}
.hearts svg{width:24px;height:24px}
.hearts .lost{opacity:.2;transform:scale(.85)}
.combo{font-family:var(--f-mono);font-weight:700;font-size:14px;padding:4px 10px;border-radius:99px;background:var(--sunk);color:var(--muted);transition:background .2s,color .2s}
.combo.hot{background:var(--gold);color:#1a1300}
.xp{font-family:var(--f-mono);font-weight:700;font-size:15px}

.track{position:relative;height:44px;margin:0 6px}
.track .rail{position:absolute;left:0;right:0;top:28px;height:6px;border-radius:3px;background:var(--rule)}
.track .done{position:absolute;left:0;top:28px;height:6px;border-radius:3px;background:var(--tram);transition:width .5s}
.track .stop{position:absolute;top:24px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--card);border:3px solid var(--rule)}
.track .stop.ok{border-color:var(--good);background:var(--good)}
.track .stop.no{border-color:var(--signal);background:var(--signal)}
.track .tram{position:absolute;top:0;margin-left:-17px;width:34px;height:22px;transition:left .5s cubic-bezier(.3,.9,.3,1.1)}
.stopname{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.stopname b{font-family:var(--f-display);font-size:18px}

.qcard{background:var(--card);border-radius:20px;padding:20px;border:2px solid var(--rule);display:flex;flex-direction:column;gap:14px}
.qcard h2{font-size:clamp(20px,5vw,25px);font-weight:800}
.qcard .en{color:var(--muted);font-size:14px;margin-top:-6px}
.cur{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--l4);background:var(--sunk);padding:3px 9px;border-radius:99px;align-self:flex-start}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;padding:12px 14px;border:2px solid var(--rule);border-radius:14px;background:var(--card);box-shadow:0 3px 0 var(--rule);transition:transform .08s,background .2s,border-color .2s}
.opt:not([disabled]):hover{border-color:var(--tram)}
.opt:not([disabled]):active{transform:translateY(2px);box-shadow:0 1px 0 var(--rule)}
.opt .k{flex:none;width:28px;height:28px;border-radius:8px;background:var(--sunk);display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:13px}
.opt[disabled]{cursor:default}
.opt.right{background:var(--good-bg);border-color:var(--good);box-shadow:0 3px 0 var(--good)}
.opt.right .k{background:var(--good);color:var(--card)}
.opt.wrong{background:var(--bad-bg);border-color:var(--signal);box-shadow:0 3px 0 var(--signal);animation:shake .35s}
.opt.wrong .k{background:var(--signal);color:var(--card)}
.opt.dim{opacity:.5}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

.fb{border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.fb.ok{background:var(--good-bg)}
.fb.no{background:var(--bad-bg)}
.fb h3{font-size:19px}
.fb.ok h3{color:var(--good)} .fb.no h3{color:var(--signal)}
.fb p{margin:0;font-size:15px}
.pop{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font-family:var(--f-display);font-weight:800;font-size:34px;color:var(--gold);pointer-events:none;animation:pop .9s forwards;z-index:30;text-shadow:0 2px 0 var(--card)}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-110%) scale(1)}}

.btn{border:none;border-radius:14px;padding:14px 18px;font-weight:600;font-size:16px;background:var(--tram);color:var(--tram-ink);box-shadow:0 4px 0 color-mix(in srgb, var(--tram) 60%, #000);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb, var(--tram) 60%, #000)}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--rule);box-shadow:0 4px 0 var(--rule)}
.btn.bad{background:var(--signal);box-shadow:0 4px 0 color-mix(in srgb, var(--signal) 60%, #000)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 140px}

/* result */
.result{background:var(--card);border-radius:22px;padding:24px 20px;border:2px solid var(--rule);display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.bigstars{display:flex;gap:6px}
.bigstars svg{width:56px;height:56px}
.bigstars svg.on{animation:starin .5s backwards}
@keyframes starin{from{transform:scale(0) rotate(-40deg)}}
.result h2{font-size:30px;font-weight:800}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.stat{background:var(--sunk);border-radius:12px;padding:10px 6px}
.stat b{display:block;font-family:var(--f-mono);font-size:22px}
.stat small{font-size:12px;color:var(--muted)}
.newb{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.newb span{background:var(--gold);color:#1a1300;font-weight:600;font-size:13px;padding:4px 10px;border-radius:99px}

/* cards */
.flash{background:var(--card);border-radius:20px;padding:22px;border:2px solid var(--rule);display:flex;flex-direction:column;gap:14px;min-height:300px}
.flash .say{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:14px}
.flash .say svg{width:22px;height:22px;flex:none}
.ans{border-top:2px dashed var(--rule);padding-top:14px;display:flex;flex-direction:column;gap:6px}
.ans b{font-family:var(--f-display);font-size:21px;color:var(--good)}

#fx{position:fixed;inset:0;pointer-events:none;z-index:40}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){.lines{grid-template-columns:1fr}.badges{grid-template-columns:repeat(2,1fr)}}

/* app-only additions */
.daystreak{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-weight:700;font-size:14px;color:var(--l4)}
.daystreak svg{width:18px;height:18px}
.settings{background:var(--card);border:2px solid var(--rule);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.setrow b{display:block;font-size:16px}
.setrow span{color:var(--muted);font-size:14px}
.switch{position:relative;width:52px;height:30px;flex:none;border-radius:99px;border:none;background:var(--rule);transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--card);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--tram)}
.switch[aria-checked="true"]::after{transform:translateX(22px)}
input[type="time"]{font:inherit;font-family:var(--f-mono);font-size:16px;color:var(--ink);background:var(--sunk);border:2px solid var(--rule);border-radius:10px;padding:6px 10px}
details.about{background:var(--card);border:2px solid var(--rule);border-radius:16px;padding:14px}
details.about summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between}
details.about summary::after{content:"+";font-family:var(--f-mono);color:var(--muted)}
details.about[open] summary::after{content:"–"}
details.about h3{font-size:16px;margin-top:14px}
details.about p{font-size:14px;color:var(--muted);margin:6px 0 0;-webkit-user-select:text;user-select:text}

/* Swiss-wide: onboarding, pickers */
.onb{display:flex;flex-direction:column;gap:18px}
.onb h2{font-size:30px;font-weight:800}
.onb p{margin:0;color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid var(--rule);background:var(--card);border-radius:99px;padding:8px 16px;font-weight:600;box-shadow:0 3px 0 var(--rule)}
.chip[aria-pressed="true"]{border-color:var(--tram);background:var(--good-bg);box-shadow:0 3px 0 var(--tram)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.cbtn{display:flex;align-items:center;gap:10px;text-align:left;border:2px solid var(--rule);background:var(--card);border-radius:12px;padding:8px 10px;min-width:0}
.cbtn b{flex:none;width:34px;height:26px;border-radius:6px;background:var(--sunk);display:grid;place-items:center;font-family:var(--f-mono);font-size:12px}
.cbtn span{font-size:14px;line-height:1.2;min-width:0;overflow-wrap:anywhere}
.cbtn[aria-pressed="true"]{border-color:var(--tram);background:var(--good-bg)}
.cbtn[aria-pressed="true"] b{background:var(--tram);color:var(--tram-ink)}
select{font:inherit;font-size:15px;color:var(--ink);background:var(--sunk);border:2px solid var(--rule);border-radius:10px;padding:6px 8px;max-width:58%}
.sub-en{color:var(--muted);font-size:14px;font-style:italic}
.fb .sub-en{margin-top:4px}
.ctag{font-family:var(--f-mono);font-size:12px;background:var(--sunk);border-radius:6px;padding:2px 6px;margin-left:6px;color:var(--muted)}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="wrap">

<!-- ONBOARDING -->
<section id="onb" class="onb" hidden>
  <div class="brand"><div class="brand-mark">S</div><div><h1>Swiss Bürgerquiz</h1><div class="eyebrow" id="oSub"></div></div></div>
  <h2 id="oTitle"></h2>
  <p id="oText"></p>
  <div class="eyebrow" id="oLangT"></div>
  <div class="chips" id="oLangs"></div>
  <div class="eyebrow" id="oCantonT"></div>
  <div class="cgrid" id="oCantons"></div>
  <button class="btn" id="oStart" disabled></button>
</section>

<!-- HOME -->
<section id="home" class="wrap" style="gap:20px" hidden>
  <div class="top">
    <div class="brand"><div class="brand-mark">S</div><div><h1>Swiss Bürgerquiz</h1><div class="eyebrow" id="hSub"></div></div></div>
    <button class="iconbtn" id="mute"></button>
  </div>

  <div class="level">
    <div class="level-row"><span class="eyebrow" id="tRank"></span><span class="daystreak" id="dayStreak"></span><span class="mono" id="xpTotal"></span></div>
    <div class="level-name" id="lvlName"></div>
    <div class="bar"><i id="lvlBar"></i></div>
    <div class="note" id="lvlNext"></div>
  </div>

  <div class="eyebrow" id="tChoose"></div>
  <div class="lines" id="lines"></div>

  <div class="modes">
    <button class="mode" id="mMix"><span class="ic" style="color:var(--gold)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg></span><span><b id="tMix"></b><span id="tMixS"></span></span></button>
    <button class="mode" id="mCards"><span class="ic" style="color:var(--l3)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></span><span><b id="tCards"></b><span id="tCardsS"></span></span></button>
    <button class="mode" id="mWrong"><span class="ic" style="color:var(--signal)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></span><span><b id="tWrong"></b><span id="wrongCount"></span></span></button>
  </div>

  <div class="eyebrow" id="tBadges"></div>
  <div class="badges" id="badges"></div>

  <div class="eyebrow" id="tSettings"></div>
  <div class="settings">
    <div class="setrow"><b id="sLangT"></b><select id="sLang"></select></div>
    <div class="setrow"><b id="sCantonT"></b><select id="sCanton"></select></div>
    <div class="setrow">
      <div><b id="sEnT"></b><span id="sEnP"></span></div>
      <button class="switch" id="sEn" role="switch" aria-checked="true"></button>
    </div>
    <div class="setrow" id="remRow" hidden>
      <div><b id="remT"></b><span id="remNote"></span></div>
      <button class="switch" id="remToggle" role="switch" aria-checked="false"></button>
    </div>
    <div class="setrow" id="remTimeRow" hidden>
      <span id="remTimeT"></span>
      <input type="time" id="remTime" value="19:00">
    </div>
  </div>

  <details class="about">
    <summary id="aboutS"></summary>
    <div id="aboutB"></div>
  </details>

  <p class="note" id="hNote"></p>
</section>

<!-- PLAY -->
<section id="play" class="wrap" hidden>
  <div class="hud">
    <button class="iconbtn" id="quit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <div class="hearts" id="hearts"></div>
    <span class="combo" id="combo">×1</span>
    <span class="xp" id="xpRound">0 XP</span>
  </div>
  <div class="track" id="track"></div>
  <div class="stopname"><span class="eyebrow" id="tNext"></span><b id="stopName"></b><span class="note mono" id="qPos"></span></div>
  <div class="qcard">
    <div class="eyebrow" id="qTopic"></div>
    <h2 id="qText"></h2>
    <div class="en" id="qEn"></div>
    <div class="opts" id="opts"></div>
  </div>
  <div class="fb" id="fb" hidden><h3 id="fbH"></h3><p id="fbX"></p><p class="sub-en" id="fbEn"></p></div>
  <button class="btn" id="next" hidden></button>
</section>

<!-- RESULT -->
<section id="result" class="wrap" hidden>
  <div class="result">
    <div class="eyebrow" id="rLine"></div>
    <div class="bigstars" id="rStars"></div>
    <h2 id="rTitle"></h2>
    <p class="note" id="rSub" style="margin:0"></p>
    <div class="stats">
      <div class="stat"><b id="rScore"></b><small id="rS1"></small></div>
      <div class="stat"><b id="rXp"></b><small id="rS2"></small></div>
      <div class="stat"><b id="rCombo"></b><small id="rS3"></small></div>
    </div>
    <div class="newb" id="rBadges"></div>
  </div>
  <div class="row"><button class="btn" id="again"></button><button class="btn ghost" id="home2"></button></div>
</section>

<!-- CARDS -->
<section id="cards" class="wrap" hidden>
  <div class="hud">
    <button class="iconbtn" id="quit2"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <span class="eyebrow" id="cTitle"></span>
    <span class="mono note" id="cCount"></span>
  </div>
  <div class="flash">
    <div class="eyebrow" id="cTopic"></div>
    <h2 id="cText" style="font-size:24px;font-weight:800"></h2>
    <div class="en" id="cEn" style="color:var(--muted);font-size:14px"></div>
